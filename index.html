<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Compare ABB, Innomotics and Crompton/CG induction motor frames and catalogue prices for 10–50 HP, 2/4/6 poles and IE3/IE4.">
  <meta name="theme-color" content="#c52c32">
  <title>IEC Motor Frame Selector | Pankaj Electrical</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%23c52c32'/%3E%3Ctext x='9' y='24' font-family='Arial' font-size='23' font-weight='bold' fill='white'%3EP%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <a class="skip-link" href="#selector">Skip to motor selector</a>
  <main>
    <div class="intro"><h1>IEC motor frame selector<span class="title-dot">.</span></h1></div>
    <div class="workspace">
      <section class="input-panel" aria-labelledby="input-title">
        <h2 id="input-title">Select your motor</h2>
        <form id="selector" novalidate>
          <label for="power">Rated power <span>HP</span></label>
          <div class="power-field"><input id="power" type="text" value="20" inputmode="decimal" required><span>HP</span></div>
          <div id="pole-field"><label for="poles">Number of poles</label><select id="poles"><option value="2">2 poles</option><option value="4" selected>4 poles</option><option value="6">6 poles</option></select><output id="calculated-speed" for="poles">1500 RPM · 50 Hz</output></div>
          <div class="manufacturer-field"><label for="manufacturer">Manufacturer</label><select id="manufacturer"><option value="all">Compare all companies</option><option value="ABB">ABB</option><option value="Innomotics">Innomotics</option><option value="CG">Crompton / CG</option></select></div>
          <label for="efficiency">Efficiency requirement</label><select id="efficiency"><option value="both">Compare IE3 &amp; IE4</option><option value="IE3">IE3</option><option value="IE4">IE4</option></select>
          <button id="find-button" class="primary" type="submit" disabled>Find frame <span aria-hidden="true">→</span></button>
        </form>
      </section>
      <section class="output-panel" aria-labelledby="output-title">
        <div class="output-heading"><h2 id="output-title">Frames &amp; price comparison</h2><span id="match-count" class="badge">Loading</span></div>
        <div id="selection-summary" class="selection-summary"></div>
        <div id="results" aria-live="polite" aria-atomic="true"><p class="status-message">Loading catalogue entries…</p></div>
        <details id="reference" class="reference"><summary>Browse ratings for <span id="reference-poles">4 poles</span><span class="disclosure" aria-hidden="true">+</span></summary><div class="table-scroll"><table aria-label="Frames and prices by rating"><thead><tr id="reference-headers"></tr></thead><tbody id="reference-rows"></tbody></table></div></details>
      </section>
    </div>
  </main>
  <noscript><p class="status-message">Enable JavaScript to use the motor frame selector.</p></noscript>
</body>
</html>
